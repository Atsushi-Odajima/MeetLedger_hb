# Self-hosted MeetLedger (example). Copy ../.env.example to ../.env, fill secrets, then run from this directory:
#   docker compose --env-file ../.env up -d   (--env-file is needed so ${...} below is interpolated from ../.env)
# NOT verified in the build environment (no Docker daemon there) — run it and the smoke test in docs/OPERATIONS.md before going live.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-meetledger.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
  app:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://meetledger:${APP_DB_PASSWORD}@db:5432/meetledger
    ports:
      - "127.0.0.1:8787:8787"   # put a TLS reverse proxy (Caddy/nginx) in front; set COOKIE_SECURE=true
    volumes:
      - appdata:/data
      - models:/models
volumes:
  pgdata:
  appdata:
  models:
